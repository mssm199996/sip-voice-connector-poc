apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio
  namespace: fleet-control
  labels:
    app: kamailio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamailio
  template:
    metadata:
      labels:
        app: kamailio
    spec:
      containers:
        - name: kamailio
          image: ghcr.io/kamailio/kamailio:6.0.4-bookworm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio/kamailio.cfg
              subPath: kamailio.cfg
              readOnly: true
            - name: config
              mountPath: /etc/kamailio/kamctlrc
              subPath: kamctlrc
              readOnly: true
            - name: runtime-directory
              mountPath: /var/run/kamailio
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kamailio-config
        - name: runtime-directory
          emptyDir: {}
        - name: tmp
          emptyDir: {}