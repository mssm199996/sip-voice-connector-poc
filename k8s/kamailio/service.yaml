apiVersion: v1
kind: Service
metadata:
  name: kamailio
  namespace: fleet-control
spec:
  type: ClusterIP
  selector:
    app: kamailio
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP