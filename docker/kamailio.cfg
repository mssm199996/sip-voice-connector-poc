#!KAMAILIO

####### Global Parameters #######

debug=3
log_stderror=yes
log_facility=LOG_LOCAL0

fork=yes
children=4

port=5060
listen=udp:0.0.0.0:5060

####### Modules Section #######

loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

####### Routing Logic #######

request_route {
    xlog("L_INFO", "Received $rm from $si:$sp to $ru\n");

    # Max forwards check
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # CANCEL handling
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # Retransmission handling
    if (!is_method("ACK") && t_precheck_trans()) {
        t_check_trans();
        exit;
    }
    t_check_trans();

    # Record-route for INVITEs
    if (is_method("INVITE")) {
        record_route();
    }

    # In-dialog requests
    if (has_totag()) {
        if (loose_route()) {
            t_relay();
            exit;
        }
    }

    # OPTIONS keepalive
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Forward everything
    t_relay();
}

onreply_route {
    xlog("L_INFO", "Reply $rs $rr\n");
}